name: Playwright Tests

on:
  push:
    branches:
      - main
      - feature/*
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  playwright-tests:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60  # ✅ increase job timeout

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4  # ✅ update to v4

      - name: Setup Node.js
        uses: actions/setup-node@v4  # ✅ update to v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci  # ✅ use npm ci instead of npm install for CI

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        run: npx playwright test
        continue-on-error: true  # ✅ continue even if tests fail
        env:
          CI: true

      # ✅ Always generate report even if tests fail
      - name: Upload Monocart Report
        uses: actions/upload-artifact@v4  # ✅ update to v4
        if: always()  # ✅ always upload
        with:
          name: Tracsens-Monocart-Report
          path: monocart-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tracsens-Playwright-Report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tracsens-Test-Results
          path: test-results/
          retention-days: 30
          if-no-files-found: warn